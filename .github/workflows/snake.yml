name: Gerar cobrinha das contribuições

on:
  # roda todo dia à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda quando você atualizar a branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # baixa o repositório (precisa do script que gera os cards)
      - name: Baixar o repositório
        uses: actions/checkout@v4

      # gera os cards de estatísticas, linguagens e sequência (stats.svg, langs.svg, streak.svg)
      - name: Gerar os cards de estatísticas
        run: python .github/scripts/gerar_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
          SAIDA: dist

      # gera as duas versões da imagem da cobrinha (clara e escura)
      - name: Gerar o SVG da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # publica tudo (cards + cobrinha) na branch "output"
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
